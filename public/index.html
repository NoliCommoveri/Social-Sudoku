<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carson Family Gameroom</title>
<!-- Inert until the PWA phase brings real icons. Without it every load logs
     a 404, which is noise when debugging on the phone. -->
<link rel="icon" href="data:,">
<style>
  :root {
    color-scheme: light;
    --ink: #1c2028;
    --ink-soft: #5b6470;
    --edge: #cfd5dd;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100dvh;
    display: grid;
    place-content: center;
    gap: 1.5rem;
    padding: 2rem 1.25rem;
    font-family: system-ui, sans-serif;
    color: var(--ink);
    background: #fff;
    text-align: center;
  }

  h1 {
    margin: 0;
    font-size: 1.5rem;
    font-weight: 600;
  }

  p {
    margin: 0;
    color: var(--ink-soft);
  }

  a {
    display: block;
    padding: 1rem 2rem;
    border: 1px solid var(--edge);
    border-radius: 0.75rem;
    font-size: 1.25rem;
    text-decoration: none;
    color: inherit;
  }
</style>
</head>
<body>

<h1>Carson Family Gameroom</h1>

<a href="/sudoku/">Sudoku</a>

<p>More to come.</p>

</body>
</html>
